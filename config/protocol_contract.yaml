# ==============================================================================
# PROTOCOL CONTRACT — Aegis-Tank
# Values that Python (PC) and ESP32 must understand identically
# ==============================================================================
# Both sides MUST read this file and code must follow it exactly
# If the format differs from here, the system will silently break (no clear error)
# Whenever the protocol changes → always bump version + last_updated to track drift
# ==============================================================================

version: "1.3"
date_created: "2026-06-25"
last_updated: "2026-07-13"
note: |
  Rebuilt from the R.N.T. project — the old v1.0 contract (2026-06-11) was carried over wholesale
  v1.1: changed network topology to home WiFi
  v1.2: TURRET/TILT changed from absolute angle to direction+speed (real hardware has no angle sensor) · LASER renamed to FIRE (the real mechanism is a spring-release, not a laser) — see decisions.md
  v1.3: TRACK adds PIVOT_LEFT/PIVOT_RIGHT (both wheels spin opposite directions) separate from the old TURN_LEFT/TURN_RIGHT which became skid-turn (one side stops, other side drives) — see decisions.md
  ✅ 2026-07-13: src/ and firmware/esp32_wroom fully updated to match v1.2 (aimer.py, command_sender.py, main.py, main.cpp) — all unit tests pass
  ✅ 2026-07-13: pin map defined (`hardware/pin_map.md`), firmware has real PWM/GPIO driving code (not yet flashed to / wired up on real hardware)

network:
  camera:
    host: "192.0.2.10"  # placeholder (RFC 5737 TEST-NET-1) — replace with your ESP32-CAM's actual DHCP-assigned IP
    port: 80
    stream_port: 81
    protocol: "HTTP/TCP"
    endpoint: "http://192.0.2.10:81/stream"  # same placeholder as host above
    format: "MJPEG"
    note: |
      Decided 2026-07-01: connect to home WiFi as a client (no self-hosted AP) — see decisions.md
      host is the board's real DHCP-assigned IP as of the test date — not fixed yet (the router may hand out a new IP after reboot)
      TODO before long-term real use: set a DHCP reservation on the router or a static IP in firmware, otherwise the PC-side src/ won't be able to reach the camera if the IP changes
  motor_controller:
    host: "192.0.2.11"  # placeholder (RFC 5737 TEST-NET-1) — replace with your ESP32-WROOM's actual DHCP-assigned IP
    port: 5555
    protocol: "UDP"
    note: "One-way send, no TCP handshake — host is a real DHCP-assigned IP (connected 2026-07-01), may change if the router reassigns"

commands:
  format_overview: |
    Every command has the form: TYPE:FIELD2:FIELD3
    - Part 1 (TYPE):   command kind [TRACK | TURRET | TILT | FIRE]
    - Part 2 (FIELD2): first parameter (direction, ON/OFF)
    - Part 3 (FIELD3): value (speed, duration)
    - Separated by ':' (colon) · Encoding UTF-8 bytes
    v1.2: TURRET/TILT no longer send an absolute angle — the real hardware (pan/tilt) is a plain DC motor
    with no potentiometer/encoder to measure angle, so commanding "go to angle X" directly isn't possible. Sends
    direction+speed the same way as TRACK instead, and relies on the camera (feedback every frame, ~20Hz) to close the loop instead of an on-board sensor (visual servoing)

  TRACK:
    format: "TRACK:direction:speed"
    field2:
      name: direction
      type: "string (enum)"
      allowed: ["FORWARD", "BACKWARD", "STOP", "TURN_LEFT", "TURN_RIGHT", "PIVOT_LEFT", "PIVOT_RIGHT"]
      note: |
        TURN_LEFT/TURN_RIGHT = skid-turn (one wheel stops, the other drives at speed) — used for general movement
        PIVOT_LEFT/PIVOT_RIGHT = pivot-turn (both wheels spin opposite directions at equal speed) — used when turning the body to help aim (aim-assist)
        Added in v1.3 (2026-07-13) — see decisions.md
    field3:
      name: speed
      type: integer
      range: [0, 255]
      unit: "power level (0=stop, 255=max) — ESP32 converts this to PWM for L298N#1"
    example: "TRACK:FORWARD:200"

  TURRET:
    format: "TURRET:direction:speed"
    field2:
      name: direction
      type: "string (enum)"
      allowed: ["LEFT", "RIGHT", "STOP"]
    field3:
      name: speed
      type: integer
      range: [0, 255]
      unit: "power level (0=stop, 255=max) — ESP32 converts this to PWM for L298N#2 channel A"
    hardware_note: |
      DC motor through L298N#2 — no angle sensor (no potentiometer/encoder)
      The PC re-sends every loop cycle (~20Hz) based on the pixel error seen from the camera, not a one-shot command
    example: "TURRET:LEFT:150"

  TILT:
    format: "TILT:direction:speed"
    field2:
      name: direction
      type: "string (enum)"
      allowed: ["DOWN", "STOP"]
      note: "No UP — only motor-driven DOWN exists. Tilting up comes from the return spring (passive) when STOP is commanded"
    field3:
      name: speed
      type: integer
      range: [0, 255]
      unit: "power level — ESP32 converts this to PWM for L298N#2 channel B"
    hardware_note: |
      Mechanism: a single DC motor turns a cam/worm that pushes the gun mount down, one direction only
      Tilting up = the return spring pulls the gun mount back up on its own once the motor stops pushing — no motor involved
      No angle sensor, same as TURRET — this is open-loop + visual feedback from the camera
    example: "TILT:DOWN:180"

  FIRE:
    format: "FIRE:state:duration_ms"
    field2: { name: state, type: "string (enum)", allowed: ["ON", "OFF"] }
    field3:
      name: duration_ms
      type: integer
      range: [0, 32767]
      unit: "milliseconds (used with ON; OFF sends 0)"
    hardware_note: "Formerly named LASER (renamed 2026-07-01) — the real mechanism is a spring-release: a DC motor spins one direction to release the firing spring, not a laser diode"
    example: "FIRE:ON:1000"

constraints:
  clamping:
    python_side: |
      Python clamps before sending:
      - TRACK speed:   max(0, min(255, value))
      - TURRET speed:  max(0, min(255, value))
      - TILT speed:    max(0, min(255, value))
      - FIRE duration: max(0, min(32767, value))
    esp32_side: |
      ESP32 clamps again before converting to PWM (authoritative, fail-safe):
      - Never trust that Python sent a correct value — UDP may be corrupted/dropped
      - Re-clamp every value received · out-of-range value -> log + safe state
  parsing:
    esp32: |
      1. split the message by ':'
      2. check the token count (must be 3)
      3. look at token[0] (TYPE) to dispatch
      4. check token[2] (FIELD3) against its range
      5. wrong format/out of range -> log + drop the command

network_reliability:
  note: "UDP does not guarantee delivery — a fail-safe is required"
  timeout_ms: 500
  timeout_behavior: "No command received for over 500ms -> stop all motors + return to safe state automatically"
  default_state: "STOP (track stopped, turret stopped, tilt stopped [the spring will pull it back up on its own if not already fully up], fire off)"

notes:
  why_direction_speed_not_angle: |
    (replaces the old why_degree_not_pwm — 2026-07-01)
    Originally assumed pan/tilt were servos (send a degree value, let the ESP32 convert to PWM) — the real
    hardware is a plain DC motor with no potentiometer/encoder to measure angle at all, so commanding "go to
    angle X" directly isn't possible in hardware.
    Changed to send direction+speed like TRACK, relying on the camera (feedback every frame) to close the loop instead
  why_esp32_clamps: |
    UDP has no integrity check, a packet may be corrupted -> the motors must be protected from out-of-range values

migration_notes: |
  Whenever the protocol is updated, version + last_updated must change to track which side is using which version
