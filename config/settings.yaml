# ==============================================================================
# SETTINGS — the real tunable values the PC-side Python system runs with
# Unlike protocol_contract.yaml, this file holds "values you adjust" rather than the wire format
# Change values here instead of the code when calibrating for real
# ==============================================================================

camera:
  stream_url: "http://192.0.2.10:81/stream"  # placeholder (RFC 5737 TEST-NET-1) — replace with your ESP32-CAM's actual DHCP-assigned IP
  frame_width: 320
  frame_height: 240
  # TODO calibrate: the real horizontal FOV of the OV2640 hasn't been measured, using an estimate from typical datasheets (~60-65°)
  horizontal_fov_deg: 60.0

motor_controller:
  # Actually connected 2026-07-01 — IP is DHCP-assigned like the camera, may change if the router reassigns
  host: "192.0.2.11"  # placeholder (RFC 5737 TEST-NET-1) — replace with your ESP32-WROOM's actual DHCP-assigned IP
  port: 5555
  send_rate_hz: 20   # must be faster than the ESP32-side fail-safe timeout (protocol_contract.yaml timeout_ms), otherwise the board will enter safe state on its own

detection:
  # TODO: define the project's real target — currently set to "person" as default just to test the pipeline
  target_class: "person"
  conf_threshold: 0.5
  model_path: "models/yolov8n.pt"   # smallest of YOLOv8 — can be changed to a self-trained model later

tracking:
  algorithm: "kalman"   # Decided 2026-07-01 — see decisions.md (reasoning already in overview.md)
  process_noise: 1.0
  measurement_noise: 10.0

aiming:
  aim_tolerance_px: 15   # the error distance considered "aimed accurately enough" to fire — TODO tune once real hardware exists
  pid_pan:  { kp: 0.6, ki: 0.02, kd: 0.15 }
  pid_tilt: { kp: 0.6, ki: 0.02, kd: 0.15 }
  # TODO: all PID values are rough starting estimates, need real tuning on-site with real servos

loop:
  frequency_hz: 20   # main loop must run with a fixed dt (see AGENTS.md) so Kalman/PID compute correctly

control:
  # TODO: all values here are rough starting estimates, need real tuning once real tracks+turret hardware exists
  body_turn_threshold_deg: 45   # pan beyond this many degrees -> turn the whole vehicle body instead of just the turret (AGENTS.md main loop item 3)
  body_turn_speed: 120          # 0-255 per the TRACK protocol
  scan_sweep_limit_deg: 60      # virtual angle (estimated, no real sensor) used to time the sweep direction switch
  scan_step_deg_per_sec: 30     # virtual angle accumulation rate per second, only used for timing, not a real position
  scan_speed: 120               # turret motor speed while scanning for a target (0-255 per the TURRET protocol)
  fire_burst_ms: 500            # fire duration per burst when aimed on target
