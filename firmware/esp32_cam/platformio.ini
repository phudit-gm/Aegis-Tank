[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
board_build.partitions = min_spiffs.csv

[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = aegis-cam.local
upload_flags =
    --auth=vanitas
