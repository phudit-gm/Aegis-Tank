[env:esp32wroom]
; pinned at 7.0.1 (arduino-esp32 core 2.0.17) because main.cpp uses ledcSetup/ledcAttachPin/ledcWrite(channel,...)
; -- if upgraded to core 3.x (new ledcAttach(pin,...) API), the PWM code must be updated to match
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

[env:esp32wroom_ota]
extends = env:esp32wroom
upload_protocol = espota
upload_port = aegis-wroom.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
