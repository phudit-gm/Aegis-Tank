[env:esp32wroom]
; pin ไว้ที่ 7.0.1 (arduino-esp32 core 2.0.17) เพราะ main.cpp ใช้ ledcSetup/ledcAttachPin/ledcWrite(channel,...)
; -- ถ้าอัปเป็น core 3.x (ledcAttach(pin,...) API ใหม่) ต้องแก้โค้ด PWM ให้ตรงด้วย
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

[env:esp32wroom_ota]
extends = env:esp32wroom
upload_protocol = espota
upload_port = aegis-wroom.local
upload_flags =
    --auth=vanitas
