# Wokwi simulation config — simulates firmware/esp32_wroom (motors controlling turret/tracks)
# firmware/elf comes from the PlatformIO build of env:esp32wroom (see firmware/esp32_wroom/platformio.ini)
# Run `pio run -e esp32wroom` in firmware/esp32_wroom first before the .bin/.elf files exist for Wokwi to load
#
# ⚠️ Limitation: the Wokwi cloud simulator can check boot/PWM/GPIO/Serial log, but cannot connect via UDP to a real PC on the LAN
# Use it only to check pin map/motor direction/fail-safe logic, not for end-to-end UDP round-trip testing

[wokwi]
version = 1
firmware = "firmware/esp32_wroom/.pio/build/esp32wroom/firmware.bin"
elf = "firmware/esp32_wroom/.pio/build/esp32wroom/firmware.elf"
